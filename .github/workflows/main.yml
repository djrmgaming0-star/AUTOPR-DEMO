name: AutoPR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autopr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target_repo
          fetch-depth: 0

      - name: Checkout AutoPR
        uses: actions/checkout@v4
        with:
          repository: djrmgaming0-star/AUTOPR
          path: autopr
          token: ${{ secrets.AUTOPR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: autopr
        run: pip install -r requirements

      - name: Run AutoPR
        working-directory: autopr
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna

          GITHUB_TOKEN: ${{ secrets.AUTOPR_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          WORK_ITEM_ID: ${{ github.event.issue.number }}

          AUTOPR_WORKSPACE: ${{ github.workspace }}/target_repo

          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

        run: python main.py
